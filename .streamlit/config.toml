[theme]
base = "light"
primaryColor = "#172554"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
borderColor = "#e2e8f0"
font = "sans serif"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1e293b"
primaryColor = "#172554"
linkColor = "#172554"
borderColor = "#e2e8f0"
codeBackgroundColor = "#f1f5f9"
codeTextColor = "#1e293b"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
